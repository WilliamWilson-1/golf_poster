<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#002b50">
    <title>GOLFBROTHERS Poster Studio</title>
    <meta name="description" content="上传照片并生成可下载的高尔夫成绩海报">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel" aria-label="海报预览" data-i18n-aria="posterPreview">
        <div class="topbar">
          <div class="brand-lockup">
            <span class="club-mark" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">GOLFBROTHERS</p>
              <h1>POSTER STUDIO</h1>
            </div>
          </div>
          <div class="top-actions">
            <select id="languageSelect" class="language-menu" aria-label="界面语言" data-i18n-aria="languageLabel">
              <option value="zh">中</option>
              <option value="en">EN</option>
            </select>
            <button class="icon-button" id="resetPoster" type="button" aria-label="清空海报" title="清空海报" data-i18n-title="resetPoster">↻</button>
          </div>
        </div>

        <div class="tournament-strip">
          <strong>GB INTERNATIONAL</strong>
          <span>TOURNAMENT GRAPHICS / 01</span>
        </div>

        <div class="template-library">
          <div class="template-library__header">
            <div>
              <span class="section-kicker">01 / TEMPLATE</span>
              <strong data-i18n="templateLibrary">选择模板</strong>
            </div>
            <div class="template-switch" role="group" aria-label="海报版式" data-i18n-aria="posterFormat">
              <button id="landscapeTemplate" class="is-active" type="button" aria-pressed="true" data-i18n="landscapeTemplate">横版</button>
              <button id="portraitTemplate" type="button" aria-pressed="false" data-i18n="portraitTemplate">竖版</button>
            </div>
          </div>
          <div class="template-gallery" aria-label="海报模板" data-i18n-aria="templateLibrary">
            <button class="template-option is-active" type="button" data-template="tour" aria-pressed="true">
              <span class="template-art template-art--tour" aria-hidden="true">
                <i class="template-art__score">68</i>
                <i class="template-art__subject"></i>
                <i class="template-art__table"></i>
              </span>
              <strong data-i18n="templateTour">赛事经典</strong>
            </button>
            <button class="template-option" type="button" data-template="heritage" aria-pressed="false">
              <span class="template-art template-art--heritage" aria-hidden="true">
                <i class="template-art__score">67</i>
                <i class="template-art__subject"></i>
                <i class="template-art__table"></i>
              </span>
              <strong data-i18n="templateHeritage">白场纪念</strong>
            </button>
            <button class="template-option" type="button" data-template="victory" aria-pressed="false">
              <span class="template-art template-art--victory" aria-hidden="true">
                <i class="template-art__score">61</i>
                <i class="template-art__subject"></i>
                <i class="template-art__table"></i>
              </span>
              <strong data-i18n="templateVictory">暗场夺冠</strong>
            </button>
            <button class="template-option" type="button" data-template="editorial" aria-pressed="false">
              <span class="template-art template-art--editorial" aria-hidden="true">
                <i class="template-art__score">62</i>
                <i class="template-art__subject"></i>
                <i class="template-art__table"></i>
              </span>
              <strong data-i18n="templateEditorial">杂志侧栏</strong>
            </button>
          </div>
        </div>

        <div class="poster-stage">
          <canvas id="posterCanvas" class="is-layout-mode" width="1080" height="1080" aria-label="海报预览画布" data-i18n-aria="posterCanvas"></canvas>
        </div>

        <div class="primary-actions">
          <label class="file-button">
            <input id="photoInput" type="file" accept="image/*">
            <span class="upload-icon" aria-hidden="true"></span>
            <span data-i18n="uploadPhoto">上传照片</span>
          </label>
          <button id="downloadPoster" class="download-button" type="button">
            <span class="download-icon" aria-hidden="true"></span>
            <span data-i18n="downloadPoster">下载海报</span>
          </button>
        </div>
        <p id="segmentationStatus" class="recognition-status" data-state="idle" aria-live="polite" data-i18n="statusIdle">上传照片后自动识别人像</p>
      </section>

      <section class="controls-panel" aria-label="海报编辑" data-i18n-aria="posterEditor">
        <div class="tabs" role="tablist" aria-label="编辑项目" data-i18n-aria="editorSections">
          <button class="tab is-active" type="button" data-tab="photo" role="tab" data-i18n="tabPhoto">图片</button>
          <button class="tab" type="button" data-tab="scores" role="tab" data-i18n="tabScores">成绩表</button>
          <button class="tab" type="button" data-tab="total" role="tab" data-i18n="tabTotal">总成绩</button>
          <button class="tab" type="button" data-tab="profile" role="tab" data-i18n="tabProfile">昵称</button>
          <button class="tab" type="button" data-tab="extra" role="tab" data-i18n="tabExtra">额外信息</button>
        </div>

        <div class="tab-panel" data-panel="profile">
          <label class="field">
            <span data-i18n="nickname">昵称</span>
            <input id="nickname" type="text" value="" maxlength="18" autocomplete="off">
          </label>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="nicknameSize">昵称字号</span>
                <output id="nicknameFontSizeValue" for="nicknameFontSize">34px</output>
              </div>
              <input id="nicknameFontSize" type="range" min="18" max="54" value="34">
            </label>
            <label class="field color-field">
              <span data-i18n="nicknameColor">昵称颜色</span>
              <input id="nicknameColor" type="color" value="#ffffff">
            </label>
          </div>
          <label class="field">
            <span data-i18n="club">俱乐部</span>
            <input id="club" type="text" value="" maxlength="26" autocomplete="off">
          </label>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="clubSize">俱乐部字号</span>
                <output id="clubFontSizeValue" for="clubFontSize">34px</output>
              </div>
              <input id="clubFontSize" type="range" min="18" max="54" value="34">
            </label>
            <label class="field color-field">
              <span data-i18n="clubColor">俱乐部颜色</span>
              <input id="clubColor" type="color" value="#ffffff">
            </label>
          </div>
        </div>

        <div class="tab-panel" data-panel="scores">
          <label class="field">
            <span data-i18n="scoreTable">成绩表</span>
            <textarea id="scoreInput" rows="4" spellcheck="false" placeholder="输入最多 18 洞成绩，用空格或逗号分隔" data-i18n-placeholder="scorePlaceholder"></textarea>
          </label>
          <div class="field-grid">
            <label class="field">
              <span data-i18n="badge">圆形标记</span>
              <input id="badgeText" type="text" value="" maxlength="2" inputmode="numeric">
            </label>
            <label class="field">
              <span data-i18n="highlightHoles">高亮洞号</span>
              <input id="highlightInput" type="text" value="" placeholder="例如 3,6" inputmode="numeric" data-i18n-placeholder="highlightPlaceholder">
            </label>
          </div>
          <div class="color-line">
            <label for="scoreTableColor" data-i18n="scoreTableColor">成绩表颜色</label>
            <input id="scoreTableColor" type="color" value="#006337">
          </div>
        </div>

        <div class="tab-panel" data-panel="total">
          <div class="field total-field">
            <div class="field-heading">
              <label for="totalScore" data-i18n="totalScore">总成绩</label>
              <label class="toggle-control">
                <span data-i18n="autoTotal">自动统计</span>
                <input id="autoTotal" type="checkbox" role="switch" checked>
                <i aria-hidden="true"></i>
              </label>
            </div>
            <input id="totalScore" type="text" value="" maxlength="4" inputmode="numeric" readonly>
            <small id="totalHint" data-i18n="totalHintEmpty">录入成绩后自动合计</small>
          </div>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="totalSize">总分字号</span>
                <output id="totalFontSizeValue" for="totalFontSize">335px</output>
              </div>
              <input id="totalFontSize" type="range" min="160" max="1600" value="335">
            </label>
            <label class="field color-field">
              <span data-i18n="totalColor">总分颜色</span>
              <input id="totalColor" type="color" value="#083728">
            </label>
          </div>
          <label class="field">
            <span data-i18n="totalOpacity">总成绩透明度</span>
            <input id="totalOpacity" type="range" min="45" max="95" value="88">
          </label>
          <label class="field">
            <span data-i18n="totalHeight">总成绩高度</span>
            <input id="totalY" type="range" min="-420" max="1500" value="300">
          </label>
        </div>

        <div class="tab-panel" data-panel="extra">
          <label class="field">
            <span data-i18n="extraInfo">额外信息</span>
            <textarea id="extraInfo" rows="3" maxlength="56"></textarea>
          </label>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="extraSize">额外信息字号</span>
                <output id="extraFontSizeValue" for="extraFontSize">21px</output>
              </div>
              <input id="extraFontSize" type="range" min="14" max="36" value="21">
            </label>
            <label class="field color-field">
              <span data-i18n="extraColor">信息颜色</span>
              <input id="extraColor" type="color" value="#ffffff">
            </label>
          </div>
          <div class="sticker-panel">
            <div class="field-heading">
              <strong data-i18n="stickers">贴纸</strong>
              <output id="stickerCount">0/5</output>
            </div>
            <div class="sticker-actions">
              <label id="stickerUploadButton" class="sticker-upload-button">
                <input id="stickerInput" type="file" accept="image/*" multiple>
                <span class="upload-icon" aria-hidden="true"></span>
                <span data-i18n="uploadSticker">上传贴纸</span>
              </label>
              <button id="removeSticker" class="sticker-remove-button" type="button" disabled title="删除选中贴纸" data-i18n-title="removeSticker">
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <div id="stickerList" class="sticker-list" aria-label="贴纸列表" data-i18n-aria="stickerList"></div>
            <label class="field">
              <div class="field-heading">
                <span data-i18n="stickerScale">贴纸大小</span>
                <output id="stickerScaleValue" for="stickerScale">100%</output>
              </div>
              <input id="stickerScale" type="range" min="20" max="250" value="100" disabled>
            </label>
          </div>
          <label class="field">
            <span data-i18n="brandText">品牌文字</span>
            <input id="brandText" type="text" value="GOLFBROTHERS" maxlength="22" autocomplete="off">
          </label>
          <div class="font-grid">
            <label class="field">
              <span data-i18n="englishFont">英文字体</span>
              <select id="englishFont">
                <option value="arial">Arial</option>
                <option value="impact">Impact</option>
                <option value="arialBlack">Arial Black</option>
                <option value="bebasNeue">Bebas Neue</option>
                <option value="oswald">Oswald</option>
                <option value="montserrat">Montserrat</option>
                <option value="playfairDisplay">Playfair Display</option>
                <option value="georgia">Georgia</option>
                <option value="timesNewRoman">Times New Roman</option>
                <option value="franklinGothic">Franklin Gothic Medium</option>
                <option value="arialRounded">Arial Rounded MT Bold</option>
                <option value="spaceMono">Space Mono</option>
                <option value="courierNew">Courier New</option>
              </select>
            </label>
            <label class="field">
              <span data-i18n="numberFont">数字字体</span>
              <select id="numberFont">
                <option value="arialBlack">Arial Black</option>
                <option value="impact">Impact</option>
                <option value="bebasNeue">Bebas Neue</option>
                <option value="oswald">Oswald</option>
                <option value="montserrat">Montserrat</option>
                <option value="playfairDisplay">Playfair Display</option>
                <option value="georgia">Georgia</option>
                <option value="timesNewRoman">Times New Roman</option>
                <option value="spaceMono">Space Mono</option>
                <option value="courierNew">Courier New</option>
              </select>
            </label>
          </div>
        </div>

        <div class="tab-panel is-active" data-panel="photo">
          <div class="field">
            <div class="field-heading">
              <label for="zoomRange" data-i18n="backgroundSize">背景大小</label>
              <output id="zoomValue" for="zoomRange">100%</output>
            </div>
            <div class="range-row">
              <input id="zoomRange" type="range" min="80" max="220" value="100">
              <button id="resetZoom" class="range-reset" type="button" aria-label="复位背景与海报元素" title="复位背景与海报元素" data-i18n-title="resetLayout">↺</button>
            </div>
          </div>
          <label class="field">
            <div class="field-heading">
              <span data-i18n="backgroundBlur">背景模糊</span>
              <output id="backgroundBlurValue" for="backgroundBlur">0px</output>
            </div>
            <input id="backgroundBlur" type="range" min="0" max="30" value="0">
          </label>
          <div class="photo-tools">
            <div>
              <strong data-i18n="subjectDepth">人物景深</strong>
              <span id="recognitionDetail" data-i18n="waitingPhoto">等待上传照片</span>
            </div>
            <button id="retrySegmentation" type="button" disabled data-i18n="retryRecognition">重新识别</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
