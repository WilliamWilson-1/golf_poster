<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#002b50">
    <title>GOLFBROTHERS Poster Studio</title>
    <meta name="description" content="上传照片并生成可下载的高尔夫成绩海报">
    <style>
@font-face {
  font-family: "Bebas Neue";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.3.0/files/bebas-neue-latin-400-normal.woff2") format("woff2");
}

@font-face {
  font-family: "Oswald";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.2.8/files/oswald-latin-700-normal.woff2") format("woff2");
}

@font-face {
  font-family: "Playfair Display";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.3.0/files/playfair-display-latin-700-normal.woff2") format("woff2");
}

@font-face {
  font-family: "Space Mono";
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5.3.0/files/space-mono-latin-700-normal.woff2") format("woff2");
}

:root {
  color-scheme: light;
  --navy: #002b50;
  --navy-deep: #001d37;
  --navy-soft: #17486b;
  --yellow: #ffd100;
  --yellow-deep: #d9a900;
  --ink: #092b45;
  --muted: #6c7d8b;
  --line: #cfd7dd;
  --surface: #ffffff;
  --work: #eef1f3;
  --white: #ffffff;
  --success: #08755b;
  --shadow: 0 18px 44px rgba(0, 29, 55, 0.16);
}

* {
  box-sizing: border-box;
}

html {
  background: #dfe5e9;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Arial Narrow", "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: #dfe5e9;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app-shell {
  width: min(100%, 560px);
  min-height: 100vh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--work);
  box-shadow: 0 0 64px rgba(0, 29, 55, 0.2);
}

.hero-panel,
.controls-panel {
  width: 100%;
}

.hero-panel {
  background: var(--work);
}

.topbar {
  display: flex;
  min-height: 106px;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  color: var(--white);
  background: var(--navy);
  border-bottom: 4px solid var(--yellow);
}

.brand-lockup {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 13px;
}

.club-mark {
  position: relative;
  flex: 0 0 auto;
  width: 31px;
  height: 42px;
  border-left: 4px solid var(--white);
}

.club-mark::before {
  position: absolute;
  top: 2px;
  left: 3px;
  width: 26px;
  height: 17px;
  background: var(--yellow);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  content: "";
}

.eyebrow {
  margin: 0 0 3px;
  color: var(--yellow);
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
}

h1 {
  margin: 0;
  overflow-wrap: anywhere;
  color: var(--white);
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 29px;
  font-style: italic;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
}

.top-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
}

.language-menu {
  width: 62px;
  height: 46px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 4px;
  padding: 0 8px;
  color: var(--white);
  background: var(--navy-deep);
  outline: none;
  font-family: "Arial Narrow", Arial, sans-serif;
  font-size: 13px;
  font-weight: 900;
  text-align: center;
}

.language-menu:focus {
  border-color: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.28);
}

.language-menu option {
  color: var(--ink);
  background: var(--white);
}

.icon-button {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 50%;
  color: var(--white);
  background: transparent;
  font-size: 25px;
  line-height: 1;
}

.icon-button:active {
  color: var(--navy);
  background: var(--yellow);
  border-color: var(--yellow);
}

.tournament-strip {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  color: var(--navy);
  background: var(--white);
  border-bottom: 1px solid var(--line);
}

.tournament-strip strong {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 15px;
  font-style: italic;
}

.tournament-strip span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  text-align: right;
}

.template-toolbar {
  display: flex;
  min-height: 58px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 18px 0;
}

.template-toolbar__label {
  color: var(--navy);
  font-size: 12px;
  font-weight: 950;
}

.template-switch {
  display: grid;
  grid-template-columns: repeat(2, 78px);
  padding: 3px;
  border: 1px solid var(--navy);
  border-radius: 4px;
  background: var(--white);
}

.template-switch button {
  min-height: 34px;
  border-radius: 2px;
  color: var(--navy);
  background: transparent;
  font-size: 12px;
  font-weight: 950;
}

.template-switch button.is-active {
  color: var(--navy-deep);
  background: var(--yellow);
}

.template-switch button:focus-visible {
  outline: 3px solid rgba(0, 43, 80, 0.24);
  outline-offset: 2px;
}

.poster-stage {
  position: relative;
  overflow: hidden;
  margin: 10px 18px 14px;
  border: 2px solid var(--navy);
  border-radius: 6px;
  background: var(--navy-deep);
  box-shadow: var(--shadow);
}

#posterCanvas {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  touch-action: none;
  background: var(--navy-deep);
}

#posterCanvas.is-portrait {
  aspect-ratio: 3 / 4;
}

#posterCanvas.is-layout-mode {
  cursor: grab;
}

#posterCanvas.is-layout-mode:active {
  cursor: grabbing;
}

.primary-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 18px;
}

.file-button,
.download-button {
  display: flex;
  min-height: 50px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 950;
}

.file-button {
  color: var(--navy-deep);
  background: var(--yellow);
  border: 1px solid var(--yellow);
}

.file-button input {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  opacity: 0;
  pointer-events: none;
}

.download-button {
  color: var(--white);
  background: var(--navy);
  border: 1px solid var(--navy);
}

.file-button:active,
.download-button:active {
  transform: translateY(1px);
}

.action-icon {
  font-family: Arial, sans-serif;
  font-size: 21px;
  font-weight: 900;
  line-height: 1;
}

.download-icon {
  position: relative;
  display: inline-block;
  width: 20px;
  height: 22px;
  border-bottom: 3px solid currentColor;
}

.download-icon::before {
  position: absolute;
  top: 0;
  left: 8px;
  width: 4px;
  height: 12px;
  background: currentColor;
  content: "";
}

.download-icon::after {
  position: absolute;
  top: 8px;
  left: 2px;
  border-top: 9px solid currentColor;
  border-right: 8px solid transparent;
  border-left: 8px solid transparent;
  content: "";
}

.recognition-status {
  min-height: 38px;
  margin: 0;
  padding: 10px 20px 11px;
  color: var(--muted);
  background: var(--white);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 800;
}

.recognition-status::before {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 8px;
  border-radius: 50%;
  background: #94a3ad;
  content: "";
  vertical-align: 1px;
}

.recognition-status[data-state="loading"] {
  color: #8f6c00;
}

.recognition-status[data-state="loading"]::before {
  background: var(--yellow-deep);
}

.recognition-status[data-state="person"] {
  color: var(--success);
}

.recognition-status[data-state="person"]::before {
  background: var(--success);
}

.recognition-status[data-state="fallback"]::before {
  background: #a84d3f;
}

.controls-panel {
  background: var(--work);
}

.tabs {
  position: sticky;
  top: 0;
  z-index: 4;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  min-height: 70px;
  background: var(--navy);
  border-bottom: 1px solid var(--navy-deep);
}

.tab {
  position: relative;
  min-width: 0;
  min-height: 70px;
  padding: 0 4px;
  color: #91a9ba;
  background: transparent;
  font-size: 13px;
  font-weight: 950;
  white-space: nowrap;
}

.tab::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 5px;
  background: transparent;
  content: "";
}

.tab.is-active {
  color: var(--white);
}

.tab.is-active::after {
  background: var(--yellow);
}

.tab-panel {
  display: none;
}

.tab-panel.is-active {
  display: grid;
  gap: 16px;
  padding: 20px 18px calc(34px + env(safe-area-inset-bottom));
  background: var(--work);
}

.field {
  display: grid;
  min-width: 0;
  gap: 7px;
}

.field span,
.field-heading > label:first-child {
  color: var(--ink);
  font-size: 12px;
  font-weight: 950;
}

.field-heading {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.field-heading output {
  color: var(--navy-soft);
  font-family: "Arial Narrow", Arial, sans-serif;
  font-size: 12px;
  font-weight: 900;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 11px 12px;
  color: var(--ink);
  background: var(--white);
  outline: none;
}

.field input::placeholder,
.field textarea::placeholder {
  color: #99a6af;
}

.field textarea {
  resize: vertical;
  line-height: 1.45;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.4);
}

.field select {
  appearance: auto;
  font-size: 14px;
  font-weight: 850;
}

.style-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 84px;
  align-items: end;
  gap: 12px;
  padding: 12px;
  border-top: 3px solid var(--navy);
  background: var(--surface);
}

.field input[type="color"],
.color-line input[type="color"] {
  width: 48px;
  height: 48px;
  min-height: 48px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--white);
  cursor: pointer;
}

.color-field input[type="color"] {
  justify-self: start;
}

.color-line {
  display: flex;
  min-height: 62px;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  border-left: 4px solid var(--yellow);
  background: var(--surface);
}

.color-line label {
  font-size: 12px;
  font-weight: 950;
}

.total-field {
  padding: 14px;
  color: var(--white);
  background: var(--navy);
  border-bottom: 4px solid var(--yellow);
}

.total-field .field-heading > label:first-child,
.total-field .toggle-control span {
  color: var(--white);
}

.total-field input {
  min-height: 62px;
  border-color: rgba(255, 255, 255, 0.28);
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 34px;
  font-weight: 950;
}

.total-field input.is-auto {
  color: var(--navy-deep);
  background: var(--yellow);
}

.total-field small {
  color: #b7c7d3;
  font-size: 11px;
  font-weight: 800;
}

.toggle-control {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.toggle-control span {
  color: var(--muted);
  font-size: 11px;
}

.toggle-control input {
  position: absolute;
  width: 1px;
  height: 1px;
  min-height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
}

.toggle-control i {
  position: relative;
  width: 42px;
  height: 24px;
  border-radius: 12px;
  background: #9caab4;
  transition: background 160ms ease;
}

.toggle-control i::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--white);
  box-shadow: 0 1px 4px rgba(0, 29, 55, 0.24);
  content: "";
  transition: transform 160ms ease;
}

.toggle-control input:checked + i {
  background: var(--yellow);
}

.toggle-control input:checked + i::after {
  background: var(--navy-deep);
  transform: translateX(18px);
}

.toggle-control input:focus-visible + i {
  outline: 3px solid rgba(255, 209, 0, 0.42);
  outline-offset: 2px;
}

input[type="range"] {
  padding: 0;
  accent-color: var(--yellow-deep);
}

.range-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 44px;
  align-items: center;
  gap: 10px;
}

.range-reset {
  width: 44px;
  height: 44px;
  border: 1px solid var(--navy);
  border-radius: 50%;
  color: var(--white);
  background: var(--navy);
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
}

.field-grid,
.font-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.photo-tools {
  display: flex;
  min-height: 68px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 12px;
  color: var(--white);
  background: var(--navy);
  border-left: 4px solid var(--yellow);
}

.photo-tools div {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.photo-tools strong {
  color: var(--white);
  font-size: 13px;
}

.photo-tools span {
  overflow-wrap: anywhere;
  color: #a9bcc9;
  font-size: 11px;
}

.photo-tools button {
  flex: 0 0 auto;
  min-height: 38px;
  border-radius: 4px;
  padding: 0 12px;
  color: var(--navy-deep);
  background: var(--yellow);
  border: 1px solid var(--yellow);
  font-size: 12px;
  font-weight: 950;
}

.photo-tools button:disabled {
  cursor: default;
  filter: grayscale(1);
  opacity: 0.46;
}

@media (max-width: 380px) {
  .topbar {
    gap: 10px;
    padding-inline: 16px;
  }

  .brand-lockup {
    gap: 9px;
  }

  .club-mark {
    width: 27px;
  }

  .eyebrow {
    font-size: 11px;
  }

  h1 {
    font-size: 22px;
  }

  .top-actions {
    gap: 6px;
  }

  .language-menu {
    width: 54px;
    height: 42px;
    padding-inline: 5px;
  }

  .icon-button {
    width: 42px;
    height: 42px;
  }

  .tournament-strip {
    padding-inline: 16px;
  }

  .poster-stage {
    margin-inline: 12px;
  }

  .template-toolbar {
    padding-inline: 12px;
  }

  .template-switch {
    grid-template-columns: repeat(2, 68px);
  }

  .primary-actions {
    padding-inline: 12px;
  }

  .tab {
    font-size: 11px;
  }

  .tab-panel.is-active {
    padding-inline: 12px;
  }

  .font-grid {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 700px) {
  body {
    padding-block: 24px;
  }

  .app-shell {
    min-height: calc(100vh - 48px);
    border: 1px solid rgba(0, 43, 80, 0.16);
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel" aria-label="海报预览" data-i18n-aria="posterPreview">
        <div class="topbar">
          <div class="brand-lockup">
            <span class="club-mark" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">GOLFBROTHERS</p>
              <h1>POSTER STUDIO</h1>
            </div>
          </div>
          <div class="top-actions">
            <select id="languageSelect" class="language-menu" aria-label="界面语言" data-i18n-aria="languageLabel">
              <option value="zh">中</option>
              <option value="en">EN</option>
            </select>
            <button class="icon-button" id="resetPoster" type="button" aria-label="清空海报" title="清空海报" data-i18n-title="resetPoster">↻</button>
          </div>
        </div>

        <div class="tournament-strip">
          <strong>GB INTERNATIONAL</strong>
          <span>TOURNAMENT GRAPHICS / 01</span>
        </div>

        <div class="template-toolbar">
          <span class="template-toolbar__label" data-i18n="posterFormat">海报版式</span>
          <div class="template-switch" role="group" aria-label="海报版式" data-i18n-aria="posterFormat">
            <button id="landscapeTemplate" class="is-active" type="button" aria-pressed="true" data-i18n="landscapeTemplate">横版</button>
            <button id="portraitTemplate" type="button" aria-pressed="false" data-i18n="portraitTemplate">竖版</button>
          </div>
        </div>

        <div class="poster-stage">
          <canvas id="posterCanvas" width="1080" height="1080" aria-label="海报预览画布" data-i18n-aria="posterCanvas"></canvas>
        </div>

        <div class="primary-actions">
          <label class="file-button">
            <input id="photoInput" type="file" accept="image/*">
            <span class="action-icon" aria-hidden="true">＋</span>
            <span data-i18n="uploadPhoto">上传照片</span>
          </label>
          <button id="downloadPoster" class="download-button" type="button">
            <span class="download-icon" aria-hidden="true"></span>
            <span data-i18n="downloadPoster">下载海报</span>
          </button>
        </div>
        <p id="segmentationStatus" class="recognition-status" data-state="idle" aria-live="polite" data-i18n="statusIdle">上传照片后自动识别人像</p>
      </section>

      <section class="controls-panel" aria-label="海报编辑" data-i18n-aria="posterEditor">
        <div class="tabs" role="tablist" aria-label="编辑项目" data-i18n-aria="editorSections">
          <button class="tab is-active" type="button" data-tab="profile" role="tab" data-i18n="tabProfile">昵称</button>
          <button class="tab" type="button" data-tab="scores" role="tab" data-i18n="tabScores">成绩表</button>
          <button class="tab" type="button" data-tab="total" role="tab" data-i18n="tabTotal">总成绩</button>
          <button class="tab" type="button" data-tab="extra" role="tab" data-i18n="tabExtra">额外信息</button>
          <button class="tab" type="button" data-tab="photo" role="tab" data-i18n="tabPhoto">图片</button>
        </div>

        <div class="tab-panel is-active" data-panel="profile">
          <label class="field">
            <span data-i18n="nickname">昵称</span>
            <input id="nickname" type="text" value="" maxlength="18" autocomplete="off">
          </label>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="nicknameSize">昵称字号</span>
                <output id="nicknameFontSizeValue" for="nicknameFontSize">34px</output>
              </div>
              <input id="nicknameFontSize" type="range" min="18" max="54" value="34">
            </label>
            <label class="field color-field">
              <span data-i18n="nicknameColor">昵称颜色</span>
              <input id="nicknameColor" type="color" value="#ffffff">
            </label>
          </div>
          <label class="field">
            <span data-i18n="club">俱乐部</span>
            <input id="club" type="text" value="" maxlength="26" autocomplete="off">
          </label>
          <div class="style-row">
            <label class="field">
              <div class="field-heading">
                <span data-i18n="clubSize">俱乐部字号</span>
                <output id="clubFontSizeValue" for="clubFontSize">34px</output>
              </div>
              <input id="clubFontSize" type="range" min="18" max="54" value="34">
            </label>
            <label class="field color-field">

  canvas.width = layout.width;

  Object.entries(params).forEach(([name, replacement]) => {
    value = value.split(`{${name}}`).join(String(replacement));
  });
  return value;
}

  document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {

function roundedRect(context, x, y, w, h, radius) {
  const r = Math.min(radius, w / 2, h / 2);
  context.beginPath();
  context.moveTo(x + r, y);
  context.arcTo(x + w, y, x + w, y + h, r);
  context.arcTo(x + w, y + h, x, y + h, r);
  context.arcTo(x, y + h, x, y, r);
  context.arcTo(x, y, x + w, y, r);
  context.closePath();
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function parseScores() {
  const values = elements.scoreInput.value
    .split(/[\s,，、|]+/)
    .map((item) => item.trim())
    .filter(Boolean)
    .slice(0, 18);

  while (values.length < 18) {
    values.push("");
  }

  return values;
}

function getNumericScores() {
  return elements.scoreInput.value
    .split(/[\s,，、|]+/)
    .map((item) => item.trim())
    .filter(Boolean)
    .slice(0, 18)
    .map((item) => Number(item))
    .filter((score) => Number.isFinite(score));
}

function updateTotalHintText() {
  if (!elements.autoTotal.checked) {
    elements.totalHint.textContent = translate("totalHintManual");
    return;
  }
  const count = getNumericScores().length;
  elements.totalHint.textContent = count
    ? translate("totalHintCount", { count })
    : translate("totalHintEmpty");
}

function updateAutoTotal() {
  const automatic = elements.autoTotal.checked;
  elements.totalScore.readOnly = automatic;
  elements.totalScore.classList.toggle("is-auto", automatic);

  if (!automatic) {
    updateTotalHintText();
    renderPoster();
    return;
  }

  const numericScores = getNumericScores();
  const total = numericScores.reduce((sum, score) => sum + score, 0);
  elements.totalScore.value = numericScores.length ? String(Math.round(total * 10) / 10) : "";
  updateTotalHintText();
  renderPoster();
}

  elements.zoomValue.textContent = `${elements.zoomRange.value}%`;

function updateBackgroundBlurOutput() {

function parseHighlights() {
  return new Set(
    elements.highlightInput.value
      .split(/[\s,，、|]+/)
      .map((item) => Number.parseInt(item, 10))
      .filter((num) => Number.isFinite(num) && num >= 1 && num <= 18)
  );
}

function drawCoverAsset(context, asset, x, y, w, h) {
  const assetWidth = asset.naturalWidth || asset.videoWidth || asset.width;
  const assetHeight = asset.naturalHeight || asset.videoHeight || asset.height;
  const cover = Math.max(w / assetWidth, h / assetHeight) * imageState.scale;
  const drawW = assetWidth * cover;
  const drawH = assetHeight * cover;
  const drawX = x + (w - drawW) / 2 + imageState.offsetX;
  const drawY = y + (h - drawH) / 2 + imageState.offsetY;
  context.drawImage(asset, drawX, drawY, drawW, drawH);
}

    context.filter = `blur(${blur}px)`;
  }
  drawCoverAsset(context, uploadedImage, 0, topBarHeight, posterSize, posterHeight - topBarHeight);
  context.restore();
}

function drawPlaceholder(context) {
  const posterHeight = getPosterHeight();
  const horizonY = templateOrientation === "portrait" ? 860 : 660;
  context.fillStyle = "#082e4c";
  context.fillRect(0, topBarHeight, posterSize, posterHeight - topBarHeight);

  context.fillStyle = "#0d3c5e";
  context.fillRect(0, horizonY, posterSize, posterHeight - horizonY);
  context.fillStyle = "#ffd100";
  context.fillRect(74, horizonY - 42, 160, 7);
  context.fillStyle = "rgba(255,255,255,0.12)";
  context.fillRect(74, horizonY - 22, 330, 3);
}

function drawBrand(context) {
  context.fillStyle = "#000";
  context.fillRect(0, 0, posterSize, topBarHeight);

  context.save();
  context.translate(74, 20);
  context.fillStyle = "#fff";
  context.fillRect(0, -4, 5, 43);
  context.fillStyle = "#c59c35";
  context.beginPath();
  context.moveTo(7, -2);
  context.lineTo(52, 11);
  context.lineTo(7, 24);
  context.closePath();
  context.fill();
  context.restore();

  const brand = elements.brandText.value.trim() || "GOLFBROTHERS";
  const splitPoint = brand.toUpperCase().startsWith("GOLF") ? 4 : Math.max(4, Math.floor(brand.length * 0.45));
  const first = brand.slice(0, splitPoint).toUpperCase();
  const second = brand.slice(splitPoint).toUpperCase();

  context.textBaseline = "middle";
  context.textAlign = "left";
  context.font = "italic 900 40px Arial, sans-serif";
  context.fillStyle = "#fff";
  context.fillText(first, 146, 37);
  context.fillStyle = "#c99c32";
  context.fillText(second, 146 + context.measureText(first).width, 37);
}

function drawTotalScore(context) {
  const score = elements.totalScore.value.trim();
  if (!score) {
    return;
  }

  const opacity = Number(elements.totalOpacity.value) / 100;
  const x = elementPositions.total.x;
  const y = Number(elements.totalY.value);
  let fontSize = Number(elements.totalFontSize.value);

  context.save();
  context.globalAlpha = opacity;
  context.fillStyle = elements.totalColor.value;
  context.font = `950 ${fontSize}px ${getNumberFont()}`;
  context.textAlign = "center";
  context.textBaseline = "middle";
  const maxWidth = templateOrientation === "portrait" ? 470 : posterSize - 140;
  while (fontSize > 120 && context.measureText(score).width > maxWidth) {
    fontSize -= 4;
    context.font = `950 ${fontSize}px ${getNumberFont()}`;
  }
  const textWidth = context.measureText(score).width;
  context.fillText(score, x, y);
  elementBounds.total = {
    x: x - textWidth / 2 - 18,
    y: y - fontSize * 0.52 - 18,
    w: textWidth + 36,
    h: fontSize * 1.04 + 36
  };
  context.restore();
}

function drawSubjectOverlay(context) {
  if (!uploadedImage || segmentationState !== "person" || !subjectMaskSource) {
    return;
  }

  const layerCanvas = document.createElement("canvas");
  layerCanvas.width = posterSize;
  layerCanvas.height = getPosterHeight();
  const layerCtx = layerCanvas.getContext("2d");
  drawCoverAsset(layerCtx, uploadedImage, 0, topBarHeight, posterSize, getPosterHeight() - topBarHeight);
  layerCtx.globalCompositeOperation = "destination-in";
  drawCoverAsset(layerCtx, subjectMaskSource, 0, topBarHeight, posterSize, getPosterHeight() - topBarHeight);
  context.drawImage(layerCanvas, 0, 0);
}

function fitText(context, text, maxWidth, startingSize, minimumSize, fontFamily) {
  let size = startingSize;
  while (size > minimumSize) {
    context.font = `900 ${size}px ${fontFamily}`;
    if (context.measureText(text).width <= maxWidth) {
      break;
    }
    size -= 2;
  }
  context.font = `900 ${size}px ${fontFamily}`;
  return size;
}

function drawLabels(context) {
  const nickname = elements.nickname.value.trim();
  const club = elements.club.value.trim();
  const extra = elements.extraInfo.value.trim();

  context.save();
  context.shadowColor = "rgba(0,0,0,0.38)";
  context.shadowBlur = 10;
  context.shadowOffsetY = 2;
  context.textBaseline = "alphabetic";

  if (nickname) {
    const position = elementPositions.nickname;
    context.fillStyle = elements.nicknameColor.value;
    context.textAlign = templateOrientation === "portrait" ? "center" : "left";
    const maxWidth = templateOrientation === "portrait" ? 370 : 270;
    const fontSize = fitText(context, nickname, maxWidth, Number(elements.nicknameFontSize.value), 14, getEnglishFont());
    const textWidth = context.measureText(nickname).width;
    context.fillText(nickname, position.x, position.y);
    elementBounds.nickname = {
      x: position.x - (templateOrientation === "portrait" ? textWidth / 2 : 0) - 10,
      y: position.y - fontSize - 10,
      w: textWidth + 20,
      h: fontSize + 20
    };
  }

  if (club) {
    const position = elementPositions.club;
    context.fillStyle = elements.clubColor.value;
    context.textAlign = templateOrientation === "portrait" ? "center" : "right";
    const maxWidth = templateOrientation === "portrait" ? 370 : 460;
    const fontSize = fitText(context, club, maxWidth, Number(elements.clubFontSize.value), 14, getEnglishFont());
    const textWidth = context.measureText(club).width;
    context.fillText(club, position.x, position.y);
    elementBounds.club = {
      x: position.x - (templateOrientation === "portrait" ? textWidth / 2 : textWidth) - 10,
      y: position.y - fontSize - 10,
      w: textWidth + 20,
      h: fontSize + 20
    };
  }

  if (extra) {
    const position = elementPositions.extra;
    const text = extra.toUpperCase();
    context.fillStyle = elements.extraColor.value;
    const maxWidth = templateOrientation === "portrait" ? 560 : 860;
    const fontSize = fitText(context, text, maxWidth, Number(elements.extraFontSize.value), 12, getEnglishFont());
    const textWidth = context.measureText(text).width;
    context.globalAlpha = 0.9;
    context.textAlign = "center";
    if (templateOrientation === "portrait") {
      context.save();
      context.translate(position.x, position.y);
      context.rotate(Math.PI / 2);
      context.fillText(text, 0, 0);
      context.restore();
      elementBounds.extra = {
        x: position.x - fontSize / 2 - 10,
        y: position.y - textWidth / 2 - 10,
        w: fontSize + 20,
        h: textWidth + 20
      };
    } else {
      context.fillText(text, position.x, position.y);
      elementBounds.extra = {
        x: position.x - textWidth / 2 - 10,
        y: position.y - fontSize - 10,
        w: textWidth + 20,
        h: fontSize + 20
      };
    }
  }
  context.restore();
}

function drawScoreCard(context) {
  const scores = parseScores();
  const highlights = parseHighlights();
  const badge = elements.badgeText.value.trim();
  const hasScoreContent = scores.some(Boolean) || Boolean(badge);

  if (!hasScoreContent) {
    return;
  }

  elementBounds.scoreCard = {
    x: scoreBox.x,
    y: scoreBox.y,
    w: scoreBox.w,
    h: scoreBox.h
  };

  context.save();
  context.globalAlpha = 0.84;
  context.fillStyle = elements.scoreTableColor.value;
  context.fillRect(scoreBox.x, scoreBox.y, scoreBox.w, scoreBox.h);
  context.globalAlpha = 1;

  context.strokeStyle = templateOrientation === "portrait"
    ? "rgba(255, 255, 255, 0.9)"
    : "rgba(215, 197, 75, 0.92)";
  context.lineWidth = 3;
  context.beginPath();
  if (templateOrientation === "portrait") {
    context.moveTo(scoreBox.x + scoreBox.w / 2, scoreBox.y);
    context.lineTo(scoreBox.x + scoreBox.w / 2, scoreBox.y + scoreBox.h);
  } else {
    context.moveTo(scoreBox.x, scoreBox.y + scoreBox.h / 2);
    context.lineTo(scoreBox.x + scoreBox.w, scoreBox.y + scoreBox.h / 2);
  }
  context.stroke();

  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = `900 ${templateOrientation === "portrait" ? 49 : 42}px ${getNumberFont()}`;

  scores.forEach((score, index) => {
    const firstHalf = index < 9;
    const slot = index % 9;
    const cellW = templateOrientation === "portrait" ? scoreBox.w / 2 : scoreBox.w / 9;
    const cellH = templateOrientation === "portrait" ? scoreBox.h / 9 : scoreBox.h / 2;
    const col = templateOrientation === "portrait" ? (firstHalf ? 0 : 1) : slot;
    const row = templateOrientation === "portrait" ? slot : (firstHalf ? 0 : 1);
    const x = scoreBox.x + cellW * col + cellW / 2;
    const y = scoreBox.y + cellH * row + cellH / 2;
    const hole = index + 1;

    if (score && highlights.has(hole)) {
      context.strokeStyle = "rgba(255, 209, 0, 0.96)";
      context.lineWidth = 3;
      if (templateOrientation === "portrait") {
        context.beginPath();
        context.arc(x, y, 29, 0, Math.PI * 2);
        context.stroke();
      } else {
        context.strokeRect(x - 28, y - 31, 56, 62);
      }
    }

    if (hole === 1 && badge) {
      context.strokeStyle = "rgba(221, 226, 78, 0.95)";
      context.lineWidth = 3;
      context.beginPath();
      context.arc(x, y, 29, 0, Math.PI * 2);
      context.stroke();
      context.beginPath();
      context.arc(x, y, 20, 0, Math.PI * 2);
      context.stroke();
      context.fillStyle = "#fff";
      context.font = `900 30px ${getNumberFont()}`;
      context.fillText(badge, x, y + 1);
      context.font = `900 ${templateOrientation === "portrait" ? 49 : 42}px ${getNumberFont()}`;
      return;
    }

    if (score) {
      context.fillStyle = "#fff";
      context.fillText(score, x, y);
    }
  });

  context.restore();
}

function drawSelectionGuide(context) {
  if (activeEditorTab !== "photo" || !selectedElement || !elementBounds[selectedElement]) {
    return;
  }

  const bounds = elementBounds[selectedElement];
  const x = Math.max(5, bounds.x - 5);
  const y = Math.max(topBarHeight + 5, bounds.y - 5);
  const w = Math.min(posterSize - x - 5, bounds.w + 10);
  const h = Math.min(getPosterHeight() - y - 5, bounds.h + 10);

  context.save();
  context.strokeStyle = "rgba(0,29,55,0.88)";
  context.lineWidth = 8;
  context.strokeRect(x, y, w, h);
  context.setLineDash([16, 10]);
  context.strokeStyle = "#ffd100";
  context.lineWidth = 4;
  context.strokeRect(x, y, w, h);
  context.restore();
}

function renderPoster({ exporting = false } = {}) {
  const posterHeight = getPosterHeight();
  Object.keys(elementBounds).forEach((key) => delete elementBounds[key]);
  ctx.clearRect(0, 0, posterSize, posterHeight);
  ctx.save();
  roundedRect(ctx, 0, 0, posterSize, posterHeight, 26);
  ctx.clip();

  if (uploadedImage) {
    drawBackgroundImage(ctx);
  } else {
    drawPlaceholder(ctx);
  }

  const gradientStart = templateOrientation === "portrait" ? 700 : 610;
  const bottomGradient = ctx.createLinearGradient(0, gradientStart, 0, posterHeight);
  bottomGradient.addColorStop(0, "rgba(0,0,0,0)");
  bottomGradient.addColorStop(1, "rgba(0,0,0,0.44)");
  ctx.fillStyle = bottomGradient;
  ctx.fillRect(0, gradientStart, posterSize, posterHeight - gradientStart);

  drawTotalScore(ctx);
  drawSubjectOverlay(ctx);
  drawLabels(ctx);
  drawScoreCard(ctx);
  drawBrand(ctx);

  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 4;
  roundedRect(ctx, 2, 2, posterSize - 4, posterHeight - 4, 26);
  ctx.stroke();
  if (!exporting) {
    drawSelectionGuide(ctx);
  }
  ctx.restore();
}

function refreshRecognitionText() {
  const statusKeys = {
    idle: "statusIdle",
    loading: "statusLoading",
    person: "statusPerson",
    fallback: "statusFallback"
  };
  elements.segmentationStatus.textContent = translate(statusKeys[segmentationState]);
  elements.recognitionDetail.textContent = translate(
    recognitionDetailState.key,
    recognitionDetailState.params
  );
}

function updateRecognitionStatus(state, detailKey, params = {}) {
  segmentationState = state;
  recognitionDetailState = { key: detailKey, params };
  elements.segmentationStatus.dataset.state = state;
  refreshRecognitionText();
  elements.retrySegmentation.disabled = !uploadedImage || state === "loading";
  renderPoster();
}

function copySegmentationMask(mask) {
  const source = document.createElement("canvas");
  source.width = mask.width || uploadedImage.naturalWidth;
  source.height = mask.height || uploadedImage.naturalHeight;
  source.getContext("2d").drawImage(mask, 0, 0, source.width, source.height);
  return source;
}

function measureMask(maskCanvas) {
  const sample = document.createElement("canvas");
  sample.width = 160;
  sample.height = 160;
  const sampleCtx = sample.getContext("2d", { willReadFrequently: true });
  sampleCtx.drawImage(maskCanvas, 0, 0, sample.width, sample.height);
  const pixels = sampleCtx.getImageData(0, 0, sample.width, sample.height).data;

  let varyingAlpha = false;
  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] < 250) {
      varyingAlpha = true;
      break;
    }
  }

  let strongPixels = 0;
  let weightedTotal = 0;
  const pixelCount = pixels.length / 4;
  for (let i = 0; i < pixels.length; i += 4) {
    const confidence = varyingAlpha
      ? pixels[i + 3] / 255
      : (pixels[i] + pixels[i + 1] + pixels[i + 2]) / (255 * 3);
    weightedTotal += confidence;
    if (confidence >= 0.55) {
      strongPixels += 1;
    }
  }

  return {
    strongRatio: strongPixels / pixelCount,
    meanConfidence: weightedTotal / pixelCount
  };
}

function ensureSegmentationLibrary() {
  if (typeof window.SelfieSegmentation === "function") {
    return Promise.resolve();
  }
  if (segmentationLibraryPromise) {
    return segmentationLibraryPromise;
  }

  segmentationLibraryPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js";
    script.async = true;
    script.crossOrigin = "anonymous";
    script.onload = () => {
      if (typeof window.SelfieSegmentation === "function") {
        resolve();
        return;
      }
      segmentationLibraryPromise = null;
      reject(new Error("segmentation library unavailable"));
    };
    script.onerror = () => {
      script.remove();
      segmentationLibraryPromise = null;
      reject(new Error("segmentation library unavailable"));
    };
    document.head.appendChild(script);
  });

  return segmentationLibraryPromise;
}

function getSelfieSegmenter() {
  if (selfieSegmenter) {
    return selfieSegmenter;
  }
  if (typeof window.SelfieSegmentation !== "function") {
    throw new Error("segmentation library unavailable");
  }

  selfieSegmenter = new window.SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${file}`
  });
  selfieSegmenter.setOptions({
    modelSelection: 1,
    selfieMode: false
  });
  selfieSegmenter.onResults((results) => {
    if (pendingSegmentationResolve) {
      const resolve = pendingSegmentationResolve;
      pendingSegmentationResolve = null;
      resolve(results);
    }
  });
  return selfieSegmenter;
}

async function runSegmentation(token) {
  if (!uploadedImage || token !== segmentationToken) {
    return;
  }

  updateRecognitionStatus("loading", "analyzingPhoto");

  try {
    await ensureSegmentationLibrary();
    const segmenter = getSelfieSegmenter();
    const resultsPromise = new Promise((resolve) => {
      pendingSegmentationResolve = resolve;
    });
    await segmenter.send({ image: uploadedImage });
    const results = await Promise.race([
      resultsPromise,
      new Promise((_, reject) => window.setTimeout(() => reject(new Error("segmentation timeout")), 30000))
    ]);

    if (token !== segmentationToken) {
      return;
    }

    const mask = copySegmentationMask(results.segmentationMask);
    const metrics = measureMask(mask);
    const looksLikePerson =
      metrics.strongRatio >= 0.012 &&
      metrics.strongRatio <= 0.82 &&
      metrics.meanConfidence >= 0.018;

    if (looksLikePerson) {
      subjectMaskSource = mask;
      updateRecognitionStatus("person", "personRatio", {
        percent: Math.round(metrics.strongRatio * 100)
      });
    } else {
      subjectMaskSource = null;
      updateRecognitionStatus("fallback", "noClearPerson");
    }
  } catch (error) {
    if (token !== segmentationToken) {
      return;
    }
    pendingSegmentationResolve = null;
    if (selfieSegmenter && typeof selfieSegmenter.close === "function") {
      selfieSegmenter.close();
    }
    selfieSegmenter = null;
    subjectMaskSource = null;
    updateRecognitionStatus("fallback", "recognitionUnavailable");
  }
}

function requestSegmentation() {
  const token = ++segmentationToken;
  subjectMaskSource = null;
  segmentationQueue = segmentationQueue
    .catch(() => undefined)
    .then(() => runSegmentation(token));
}

function canvasPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((event.clientX - rect.left) / rect.width) * posterSize,
    y: ((event.clientY - rect.top) / rect.height) * getPosterHeight()
  };
}

function pointInsideBounds(point, bounds) {
  return (
    point.x >= bounds.x &&
    point.x <= bounds.x + bounds.w &&
    point.y >= bounds.y &&
    point.y <= bounds.y + bounds.h
  );
}

function hitTestElement(point) {
  const hitOrder = ["nickname", "club", "extra", "scoreCard", "total"];
  return hitOrder.find((key) => elementBounds[key] && pointInsideBounds(point, elementBounds[key])) || null;
}

function getElementAnchor(key) {
  if (key === "scoreCard") {
    return { x: scoreBox.x, y: scoreBox.y };
  }
  if (key === "total") {
    return { x: elementPositions.total.x, y: Number(elements.totalY.value) };
  }
  return { ...elementPositions[key] };
}

function setElementAnchor(key, x, y) {
  if (key === "scoreCard") {
    scoreBox.x = x;
    scoreBox.y = y;
    return;
  }
  if (key === "total") {
    elementPositions.total.x = x;
    elements.totalY.value = String(Math.round(y));
    return;
  }
  elementPositions[key].x = x;
  elementPositions[key].y = y;
}

function startPointer(event) {
  const point = canvasPoint(event);

  if (activeEditorTab === "photo") {
    const target = hitTestElement(point);
    if (target) {
      canvas.setPointerCapture(event.pointerId);
      selectedElement = target;
      elementDragState = {
        target,
        x: point.x,
        y: point.y,
        anchor: getElementAnchor(target),
        bounds: { ...elementBounds[target] }
      };
      dragState = null;
      renderPoster();
      return;
    }
    selectedElement = null;
  }

  if (!uploadedImage) {
    renderPoster();
    return;
  }

  canvas.setPointerCapture(event.pointerId);
  dragState = {
    x: point.x,
    y: point.y,
    offsetX: imageState.offsetX,
    offsetY: imageState.offsetY
  };
}

function movePointer(event) {
  if (elementDragState) {
    const point = canvasPoint(event);
    const bounds = elementDragState.bounds;
    const rawX = point.x - elementDragState.x;
    const rawY = point.y - elementDragState.y;
    const deltaX = clamp(rawX, 8 - bounds.x, posterSize - 8 - bounds.x - bounds.w);
    const deltaY = clamp(rawY, topBarHeight + 8 - bounds.y, getPosterHeight() - 8 - bounds.y - bounds.h);
    setElementAnchor(
      elementDragState.target,
      elementDragState.anchor.x + deltaX,
      elementDragState.anchor.y + deltaY
    );
    renderPoster();
    return;
  }

  if (!dragState) {
    return;
  }

  const point = canvasPoint(event);
  imageState.offsetX = dragState.offsetX + point.x - dragState.x;
  imageState.offsetY = dragState.offsetY + point.y - dragState.y;
  renderPoster();
}

function endPointer() {
  dragState = null;
  elementDragState = null;
}

function loadImage(file) {
  if (!file) {
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      uploadedImage = img;
      imageState = {
        scale: Number(elements.zoomRange.value) / 100,
        offsetX: 0,
        offsetY: 0
      };
      renderPoster();
      requestSegmentation();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function downloadPoster() {
  renderPoster({ exporting: true });
  const link = document.createElement("a");
  const safeName = (elements.nickname.value.trim() || "golf").replace(/[^\w\u4e00-\u9fa5-]+/g, "-");
  link.download = `${safeName}-golf-poster.png`;
  link.href = canvas.toDataURL("image/png");
  renderPoster();
  link.click();
}

function resetCanvasLayout({ render = true } = {}) {
  elements.zoomRange.value = "100";
  elements.backgroundBlur.value = "0";
  imageState = { scale: 1, offsetX: 0, offsetY: 0 };
  resetElementPositions();
  updateZoomOutput();
  updateBackgroundBlurOutput();
  if (render) {
    renderPoster();
  }
}

function resetPoster() {
  segmentationToken += 1;
  uploadedImage = null;
  subjectMaskSource = null;
  elements.photoInput.value = "";
  Object.entries(emptyValues).forEach(([key, value]) => {
    elements[key].value = value;
  });
  elements.totalOpacity.value = "88";
  elements.autoTotal.checked = true;
  resetCanvasLayout({ render: false });
  updateAutoTotal();
  updateRecognitionStatus("idle", "waitingPhoto");
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    const target = tab.dataset.tab;
    activeEditorTab = target;
    if (target !== "photo") {
      selectedElement = null;
    }
    canvas.classList.toggle("is-layout-mode", target === "photo");
    document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("is-active", item === tab));
    document.querySelectorAll(".tab-panel").forEach((panel) => {
      panel.classList.toggle("is-active", panel.dataset.panel === target);
    });
    renderPoster();
  });
});

[
  elements.nickname,
  elements.club,

elements.portraitTemplate.addEventListener("click", () => {

elements.numberFont.addEventListener("change", () => {

[

[

elements.zoomRange.addEventListener("input", () => {

canvas.addEventListener("pointerdown", startPointer);
canvas.addEventListener("pointermove", movePointer);
